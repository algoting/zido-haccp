# ============================================================================
# GitHub Actions - CD Pipeline (Staging)
# ============================================================================
# Runs on: Manual trigger only (until K8s is configured)
# Purpose: Deploy to staging environment
# ============================================================================

name: Deploy to Staging

on:
  # Temporarily disabled automatic deployment until K8s is configured
  # Uncomment the following to enable automatic deployment on push to develop:
  # push:
  #   branches: [develop]
  
  # Manual trigger only for now
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/haccp-api

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api-staging.yourdomain.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      # --------------------------------------------------------------------------
      # Build and Push Docker Image
      # --------------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------------------------
      # Deploy to Kubernetes (Staging)
      # --------------------------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/haccp-api \
            -n haccp-app-staging \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          
          kubectl rollout status deployment/haccp-api \
            -n haccp-app-staging \
            --timeout=5m

      # --------------------------------------------------------------------------
      # Run Database Migrations
      # --------------------------------------------------------------------------
      - name: Run database migrations
        run: |
          kubectl exec -n haccp-app-staging \
            deployment/haccp-api -- \
            npx prisma migrate deploy

      # --------------------------------------------------------------------------
      # Smoke Tests
      # --------------------------------------------------------------------------
      - name: Run smoke tests
        run: |
          # Wait for deployment to be ready
          sleep 30
          
          # Check health endpoint
          HEALTH_URL="https://api-staging.yourdomain.com/health"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with status $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Deployment successful! Health check passed."

      # --------------------------------------------------------------------------
      # Notify Sentry
      # --------------------------------------------------------------------------
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        if: success()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: haccp-api
        with:
          environment: staging
          version: staging-${{ github.sha }}

      # --------------------------------------------------------------------------
      # Notify Team
      # --------------------------------------------------------------------------
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Successful* :rocket:\n\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*URL:* https://api-staging.yourdomain.com"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Staging deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Failed* :x:\n\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Check:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# ============================================================================
# GitHub Actions - Security Scanning
# ============================================================================
# Runs on: Schedule and pull requests
# Purpose: Scan for security vulnerabilities and code quality issues
# ============================================================================

name: Security Scanning

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_codeql:
        description: 'Run CodeQL analysis (requires code scanning enabled)'
        required: false
        default: 'false'

jobs:
  # --------------------------------------------------------------------------
  # Dependency Scanning
  # --------------------------------------------------------------------------
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json > snyk-report.json
        continue-on-error: true

      - name: Upload Snyk report
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/upload-artifact@v3
        with:
          name: snyk-report
          path: snyk-report.json

      - name: Skip Snyk (no token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "⚠️ Skipping Snyk scan - SNYK_TOKEN not configured. Add it at https://github.com/mouradelarari1/haccp-api/settings/secrets/actions"

  # --------------------------------------------------------------------------
  # Code Scanning (CodeQL)
  # --------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_codeql == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # --------------------------------------------------------------------------
  # Docker Image Scanning
  # --------------------------------------------------------------------------
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t haccp-api:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: haccp-api:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # --------------------------------------------------------------------------
  # Secret Scanning
  # --------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # --------------------------------------------------------------------------
  # Notify Results
  # --------------------------------------------------------------------------
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [dependency-scan, codeql, docker-scan, secret-scan]
    if: always()
    steps:
      - name: Check job statuses
        id: status
        run: |
          if [ "${{ needs.dependency-scan.result }}" == "failure" ] || \
             [ "${{ needs.codeql.result }}" == "failure" ] || \
             [ "${{ needs.docker-scan.result }}" == "failure" ] || \
             [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.status == 'success' && '✅' || '❌' }} Security scan ${{ steps.status.outputs.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Security Scan ${{ steps.status.outputs.status == 'success' && 'Passed' || 'Failed' }}*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Triggered by:* ${{ github.actor }}\n*Check logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

server {
    listen 80;
    server_name zidohaccp.com www.zidohaccp.com app.zidohaccp.com;

    # Will be replaced by Certbot for SSL
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.zidohaccp.com;

    # SSL certs will be added by certbot
    # ssl_certificate /etc/letsencrypt/live/zidohaccp.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zidohaccp.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for product photos, PMS docs)
    client_max_body_size 20M;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Stripe webhooks — bypass /api/ rewrite, raw body needed
    location /billing/webhooks/stripe {
        proxy_pass http://127.0.0.1:3000/billing/webhooks/stripe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't buffer — Stripe needs the raw body
        proxy_request_buffering off;
    }

    # Uploaded files (product photos, exports, PMS docs)
    location /uploads/ {
        alias /opt/haccp/haccp-api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Web app (static files)
    location / {
        root /opt/haccp/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

# ============================================================================
# Docker Compose - HACCP API Local Development
# ============================================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f api    # View API logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes
# ============================================================================

version: '3.8'

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: haccp-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haccp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haccp-network

  # --------------------------------------------------------------------------
  # HACCP API
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: haccp-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/haccp_db?schema=public
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
      API_URL: http://localhost:3000
      # Stripe (use test keys)
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # GCS (optional - leave empty for local file storage)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_KEY_FILE: ${GCP_KEY_FILE:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      # Sentry (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      # Mount uploads directory for file persistence
      - ./uploads:/app/uploads
      # Mount GCP key file if exists
      - ${GCP_KEY_FILE:-./gcp-key.json}:/app/gcp-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health/liveness', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - haccp-network
    command: >
      sh -c "
        npx prisma db push --accept-data-loss &&
        node dist/main
      "

  # --------------------------------------------------------------------------
  # Redis (Optional - for caching/queues)
  # --------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: haccp-redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - haccp-network

  # --------------------------------------------------------------------------
  # pgAdmin (Optional - Database Management UI)
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: haccp-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@haccp.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - haccp-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  # redis_data:
  #   driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  haccp-network:
    driver: bridge

# ============================================================================
# Notes:
# ============================================================================
# 1. Default credentials for PostgreSQL: postgres/postgres
# 2. pgAdmin accessible at: http://localhost:5050 (admin@haccp.local / admin)
# 3. API accessible at: http://localhost:3000
# 4. API documentation: http://localhost:3000/api
# 5. Health check: http://localhost:3000/health
# 6. To use production keys, create .env file with real values
# 7. Remember to run migrations: docker-compose exec api npx prisma migrate deploy
# ============================================================================

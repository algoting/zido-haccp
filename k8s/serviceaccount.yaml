# ============================================================================
# Kubernetes ServiceAccount
# ============================================================================
# Service account with permissions for GCP, database access, etc.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haccp-api-sa
  namespace: haccp-app
  annotations:
    # For GKE Workload Identity
    iam.gke.io/gcp-service-account: haccp-api@your-project-id.iam.gserviceaccount.com

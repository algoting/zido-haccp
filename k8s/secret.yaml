apiVersion: v1
kind: Secret
metadata:
  name: haccp-api-secrets
  namespace: haccp-app
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres-service:5432/haccp_db?schema=public"
  
  # JWT
  JWT_SECRET: "CHANGE_ME_USE_STRONG_SECRET"
  
  # Stripe
  STRIPE_API_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  STRIPE_PRICE_ID: "price_CHANGE_ME"
  
  # Sentry
  SENTRY_DSN: "https://CHANGE_ME@o123456.ingest.sentry.io/789012"
  
  # GCP
  GCP_PROJECT_ID: "CHANGE_ME"
  # GCP_KEY_FILE should be mounted as a file, not an env variable

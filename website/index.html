  <body>
    <div id="root"></div>
    <!-- Direct Stripe Subscription Modal -->
    <div id="stripe-checkout-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center; padding:1rem;">
      <div style="background:#ffffff; color:#111827; border-radius:1.25rem; padding:1.75rem; max-width:28rem; width:100%; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); border:1px solid #E5E7EB; box-sizing:border-box;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h3 style="font-size:1.25rem; font-weight:700; color:#111827; margin:0;">Souscrire au Pack <span id="modal-plan-name" style="color:#0D9488;">PRO SUIVI</span></h3>
          <button onclick="closeStripeCheckoutModal()" style="background:none; border:none; font-size:1.75rem; color:#9CA3AF; cursor:pointer; font-weight:700;">&times;</button>
        </div>
        
        <div style="background:#F0FDFA; border:1px solid #CCFBF1; border-radius:0.75rem; padding:1rem; margin-bottom:1.25rem;">
          <p style="font-size:0.9rem; font-weight:700; color:#134E4A; margin:0;">Formule Sélectionnée : <span id="modal-plan-price" style="color:#0D9488;">89€ HT / mois</span></p>
          <p style="font-size:0.75rem; color:#0F766E; margin-top:0.35rem; margin-bottom:0;">✓ Matériel & Sondes inclus • Activation immédiate • Sécurisé Stripe</p>
        </div>

        <form id="public-checkout-form" onsubmit="handlePublicCheckoutSubmit(event)">
          <input type="hidden" id="modal-plan-id" value="PRO_SUIVI">
          
          <div style="margin-bottom:1rem;">
            <label style="display:block; font-size:0.875rem; font-weight:600; color:#374151; margin-bottom:0.375rem;">Nom de votre Établissement *</label>
            <input type="text" id="checkout-est-name" required placeholder="ex: Le Bistro Gourmand" style="width:100%; padding:0.75rem 1rem; border:1px solid #D1D5DB; border-radius:0.75rem; font-size:0.875rem; outline:none; box-sizing:border-box;">
          </div>

          <div style="margin-bottom:1.25rem;">
            <label style="display:block; font-size:0.875rem; font-weight:600; color:#374151; margin-bottom:0.375rem;">Adresse Email Professionnelle *</label>
            <input type="email" id="checkout-email-addr" required placeholder="contact@restaurant.fr" style="width:100%; padding:0.75rem 1rem; border:1px solid #D1D5DB; border-radius:0.75rem; font-size:0.875rem; outline:none; box-sizing:border-box;">
          </div>

          <button type="submit" id="checkout-submit-btn" style="width:100%; padding:0.875rem 1rem; background:linear-gradient(to right, #0D9488, #059669); color:#ffffff; font-weight:700; border:none; border-radius:0.75rem; font-size:1rem; cursor:pointer; box-shadow:0 10px 15px -3px rgba(13,148,136,0.3); display:flex; align-items:center; justify-content:center; gap:0.5rem;">
            <span id="btn-text">Proceder au Paiement Sécurisé (Stripe)</span>
          </button>
          
          <p style="font-size:0.75rem; text-align:center; color:#6B7280; margin-top:0.85rem; margin-bottom:0;">
            🔒 Cryptage SSL 256 bits — Traité par Stripe Payments Europe
          </p>
        </form>
      </div>
    </div>

    <script>
      function openStripeCheckoutModal(planName, planPrice, planId) {
        document.getElementById("modal-plan-name").textContent = planName;
        document.getElementById("modal-plan-price").textContent = planPrice;
        document.getElementById("modal-plan-id").value = planId;
        var modal = document.getElementById("stripe-checkout-modal");
        modal.style.display = "flex";
      }

      function closeStripeCheckoutModal() {
        var modal = document.getElementById("stripe-checkout-modal");
        modal.style.display = "none";
      }

      function handlePublicCheckoutSubmit(e) {
        e.preventDefault();
        var estName = document.getElementById("checkout-est-name").value;
        var email = document.getElementById("checkout-email-addr").value;
        var plan = document.getElementById("modal-plan-id").value;
        var btn = document.getElementById("checkout-submit-btn");
        var btnText = document.getElementById("btn-text");

        btn.disabled = true;
        btnText.textContent = "Redirection vers Stripe Checkout en cours...";

        fetch("/api/billing/public-checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, establishmentName: estName, plan: plan })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data.url) {
            window.location.href = data.url;
          } else {
            alert("Erreur lors de l'initialisation du paiement: " + (data.message || "Veuillez réessayer"));
            btn.disabled = false;
            btnText.textContent = "Proceder au Paiement Sécurisé (Stripe)";
          }
        })
        .catch(function(err) {
          console.error(err);
          window.location.href = "/login?plan=" + plan + "&checkout=true";
        });
      }

      function updatePricingButtonsDOM() {
        var buttons = document.querySelectorAll("button, a");
        buttons.forEach(function(btn) {
          var href = (btn.getAttribute("href") || "").toLowerCase();
          
          if (href === "/contact" || href === "#contact" || !href) {
            var card = btn.closest(".rounded-2xl, [class*='rounded-'], div");
            if (!card) return;
            var ct = (card.textContent || "").toUpperCase();

            if (ct.includes("ENGAGEMENT 36 MOIS") || ct.includes("TABLETTE 8 POUCES") || ct.includes("LE PLUS POPULAIRE")) {
              if (ct.includes("CONNECT") && ct.includes("59")) {
                btn.setAttribute("data-stripe-plan", "CONNECT");
                btn.setAttribute("data-stripe-name", "CONNECT");
                btn.setAttribute("data-stripe-price", "59€ HT / mois");
                btn.innerHTML = 'Commander & Payer (59€) <svg class="ml-2 h-4 w-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
              } else if (ct.includes("PRO SUIVI") && ct.includes("89")) {
                btn.setAttribute("data-stripe-plan", "PRO_SUIVI");
                btn.setAttribute("data-stripe-name", "PRO SUIVI");
                btn.setAttribute("data-stripe-price", "89€ HT / mois");
                btn.innerHTML = 'Commander & Payer (89€) <svg class="ml-2 h-4 w-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
              } else if ((ct.includes("SÉRÉNITÉ") || ct.includes("SERENITE")) && ct.includes("129")) {
                btn.setAttribute("data-stripe-plan", "SERENITE");
                btn.setAttribute("data-stripe-name", "SÉRÉNITÉ");
                btn.setAttribute("data-stripe-price", "129€ HT / mois");
                btn.innerHTML = 'Commander & Payer (129€) <svg class="ml-2 h-4 w-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
              }
            }
          }
        });
      }

      document.addEventListener("DOMContentLoaded", function() {
        setInterval(updatePricingButtonsDOM, 500);

        document.addEventListener("click", function(e) {
          var el = e.target.closest("a, button");
          if (!el) return;

          var planId = el.getAttribute("data-stripe-plan");
          var planName = el.getAttribute("data-stripe-name");
          var planPrice = el.getAttribute("data-stripe-price");

          if (planId && planName && planPrice) {
            e.preventDefault();
            e.stopPropagation();
            openStripeCheckoutModal(planName, planPrice, planId);
          }
        }, true);
      });
    </script>
